<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SilverFile staff{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #5c5c57; --line: #d9d8d2;
    --accent: #1f5f8b; --accent-ink: #ffffff; --warn-bg: #fff4d6; --warn-ink: #6b4a00;
    --bad-bg: #fde8e6; --bad-ink: #8a1c12; --ok-bg: #e5f3e8; --ok-ink: #1d5a2c; --info-bg: #e7f0f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #20201e; --ink: #ecebe6; --muted: #a8a79f; --line: #3a3a36;
      --accent: #7db8e0; --accent-ink: #10171c; --warn-bg: #3a3014; --warn-ink: #f2d58a;
      --bad-bg: #3d1d1a; --bad-ink: #f4aaa2; --ok-bg: #1b3221; --ok-ink: #a6dcb2; --info-bg: #1b2a36;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
  header a.brand { font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; }
  header span { color: var(--muted); font-size: .95rem; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 1rem 16px; }
  h1 { font-size: 1.6rem; margin: .5rem 0 1rem; overflow-wrap: anywhere; }
  h2 { font-size: 1.25rem; margin: 2rem 0 .75rem; }
  h3 { font-size: 1.05rem; margin: 1.25rem 0 .5rem; }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .9rem; color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; }
  .badge { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .85rem; font-weight: 600; white-space: nowrap; }
  .waiting_on_human { background: var(--warn-bg); color: var(--warn-ink); }
  .waiting_on_taxpayer, .in_progress { background: var(--info-bg); color: var(--accent); }
  .draft_ready { background: var(--ok-bg); color: var(--ok-ink); }
  .submitted { background: var(--accent); color: var(--accent-ink); }
  .stopped { background: var(--bad-bg); color: var(--bad-ink); }
  .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  .filters a { padding: .3rem .8rem; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; background: var(--panel); }
  .filters a[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .muted { color: var(--muted); }
  .mono, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .85rem; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .notice { padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
  .notice.error { background: var(--bad-bg); color: var(--bad-ink); }
  .notice.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .notice.warn { background: var(--warn-bg); color: var(--warn-ink); }
  dl.kv { display: grid; grid-template-columns: minmax(8rem, max-content) 1fr; gap: .35rem 1rem; margin: 0; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; }
  label { display: block; font-weight: 600; margin: .9rem 0 .3rem; }
  .hint { font-weight: 400; color: var(--muted); font-size: .9rem; }
  input[type=text], select, textarea { width: 100%; max-width: 32rem; font: inherit; padding: .5rem .6rem; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--ink); }
  textarea { min-height: 5rem; }
  .row { display: flex; gap: .5rem; max-width: 32rem; }
  .row input { flex: 1; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 1rem 0; padding: .5rem 1rem 1rem; }
  legend { font-weight: 600; padding: 0 .3rem; }
  .choice { display: flex; gap: .6rem; align-items: flex-start; font-weight: 400; }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.25rem; }
  button { font: inherit; font-weight: 600; padding: .6rem 1.2rem; border-radius: 8px; border: 1px solid var(--accent); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.secondary { background: transparent; color: var(--bad-ink); border-color: var(--bad-ink); }
  td { overflow-wrap: anywhere; }
  @media (max-width: 640px) { dl.kv { grid-template-columns: 1fr; } dl.kv dd { margin-bottom: .5rem; } th.opt, td.opt, .tid { display: none; } }
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">SilverFile staff dashboard</a><span>Draft Form 1040-SR returns, tax year 2025</span></div></header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
