# SilverFile with Docker Compose (needs Compose 2.24+, included in current Docker Desktop).
#
#   docker compose build
#   docker compose run --rm silverfile --case data/fixtures/skeleton_case.json
#   docker compose run --rm silverfile                     # interactive session
#   docker compose run --rm silverfile --sessions          # staff: list sessions
#   docker compose run --rm --entrypoint python silverfile -m pytest -q -p no:cacheprovider
#
# Sessions are stored in the silverfile-data volume. When the dashboard and the tax_math MCP server
# exist, add them here as services that mount the same volume.
services:
  silverfile:
    build: .
    image: silverfile:latest
    env_file:
      - path: .env
        required: false # holds ANTHROPIC_API_KEY; never copied into the image
    volumes:
      - silverfile-data:/data
    stdin_open: true
    tty: true

volumes:
  silverfile-data:
